name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v2.1.0.1.1
    with:
      run-govulncheck: true
      coverage-min: "90"
      test-exclude-regex: "/example(s)?($|/)"
      codecov-name: sparkplugbctl
      go-versions: '["1.27"]'
      golangci-lint-version: v2.15.0
    secrets: inherit
