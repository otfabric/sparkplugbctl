name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.3.0
    with:
      run-govulncheck: true
      fuzz-time: 10s
      coverage-min: "90"
      test-exclude-regex: "/example(s)?($|/)"
      codecov-name: sparkplugbctl
      go-versions: '["1.27"]'
      golangci-lint-version: v2.15.0
    secrets: inherit

  # The per-package floor (COVER_PKG_MIN in the Makefile) on top of the
  # aggregate gate of the shared workflow.
  coverage-floor:
    name: Per-package coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make coverage-pkg-check
