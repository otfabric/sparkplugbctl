name: Release

run-name: Release (${{ inputs.bump }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    uses: otfabric/.github/.github/workflows/go-binary-release.yml@v3.3.0
    with:
      bump: ${{ inputs.bump }}
      binary-name: sparkplugbctl
      main-path: .
      release-name-prefix: sparkplugbctl
      ldflags: "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${BUILD_DATE}"
    secrets: inherit
