# Documents against the code (DOC-008, standards/documentation.md#doc-sync).
# No path filter: this is the check that runs when ci.yaml skips a
# Markdown-only change, so branch protection can require it.
name: Docs
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: otfabric/.github/.github/workflows/docs-check.yml@v3.8.0
    with:
      docsync-version: v0.3.1
      policy-version: v1.6.1
    secrets: inherit
